name: helphive
description: Neighbours asking for help and offering it.
publish_to: none
version: 1.0.4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/launcher.png
  adaptive_icon_background: "#F5EEE4"
  adaptive_icon_foreground: assets/icons/launcher_foreground.png
